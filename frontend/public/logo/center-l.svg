<!-- center-l.svg -->
<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="lGradient" x1="0" y1="0" x2="200" y2="200">
      <stop offset="0%" stop-color="#A3CEF1"/>
      <stop offset="100%" stop-color="#274C77"/>
    </linearGradient>

    <filter id="softGlow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Vertical Part -->
  <path
    d="M85 30
       L120 30
       L105 120
       L65 145
       Z"
    fill="url(#lGradient)"
    filter="url(#softGlow)"
  />

  <!-- Bottom Part -->
  <path
    d="M70 145
       L155 145
       Q165 145 160 155
       L140 175
       Q132 182 120 182
       L55 182
       Q45 182 50 172
       Z"
    fill="url(#lGradient)"
    filter="url(#softGlow)"
  />
</svg>